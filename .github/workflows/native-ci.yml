name: Native CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate installation ID storage
        run: pnpm test:mobile-installation
      - name: Validate push token compatibility
        run: pnpm test:push-token-compatibility

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate Android project
        run: pnpm prebuild:android
      - name: Compile Android debug build
        shell: bash
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../android-build.log
      - name: Extract Android compiler errors
        if: failure()
        shell: bash
        run: |
          grep -E '(^|: )(e: |error:|fatal error:)|\.kt:[0-9]+:[0-9]+' android-build.log \
            | tail -n 250 > android-errors.txt || true
          test -s android-errors.txt || tail -n 400 android-build.log > android-errors.txt
      - name: Upload Android compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-compiler-logs
          path: |
            android-build.log
            android-errors.txt
          if-no-files-found: warn
          retention-days: 3

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate iOS project
        run: pnpm prebuild:ios
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Compile iOS simulator build
        shell: bash
        run: |
          set -o pipefail
          cd ios
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c 'import json,sys; print(json.load(sys.stdin)["workspace"]["schemes"][0])')
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ../ios-build.log
      - name: Extract iOS compiler errors
        if: failure()
        shell: bash
        run: |
          grep -E '(^|: )(error:|fatal error:)|\.swift:[0-9]+:[0-9]+:' ios-build.log \
            | tail -n 250 > ios-errors.txt || true
          test -s ios-errors.txt || tail -n 400 ios-build.log > ios-errors.txt
      - name: Upload iOS compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-compiler-logs
          path: |
            ios-build.log
            ios-errors.txt
          if-no-files-found: warn
          retention-days: 3
